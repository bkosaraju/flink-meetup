services:
  jobmanager:
    image: flink-image:2.0.0-scala_2.12
    build: docker/flink-cluster
    hostname: "jobmanager"
    expose:
      - "6123"
    ports:
      - "9081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - |
        FLINK_PROPERTIES=
          jobmanager.rpc.address: jobmanager
          taskmanager.numberOfTaskSlots: 8
          parallelism.default: 2
          classloader.resolve-order: parent-first
    depends_on:
      - kafka
      - mysql
  taskmanager:
    image: flink-image:2.0.0-scala_2.12
    expose:
      - "6121"
      - "6122"
    depends_on:
      - jobmanager
    deploy:
        replicas: 2
    command: taskmanager
    links:
      - jobmanager:jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 8
        parallelism.default: 2
        classloader.resolve-order: parent-first

#   data-generator:
#       image: apache/data-generator:1
#       build: docker/data-generator
#       depends_on:
#         - kafka
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      CLUSTER_ID: 'ciWo7IWazngRchmPES6q5A=='

      # Memory optimization
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      #Create Topics
    command: >
      bash -c "
        /etc/confluent/docker/run &
        sleep 10 &&
        for tpk in kafka rule event agg.transactions; do
          kafka-topics --bootstrap-server localhost:9092 --create --topic $$tpk --partitions 1 --replication-factor 1 --if-not-exists;
        done && \
        wait
      "
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list | grep -q 'kafka\\|rule\\|event\\|agg.transactions'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0.31
    command: --default-authentication-plugin=mysql_native_password --secure_file_priv=/data
    ports:
      - "3306:3306"
    environment:
      MYSQL_USER: "demo"
      MYSQL_PASSWORD: "demo"
      MYSQL_DATABASE: "demo"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
      - dbData:/data
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "mysql", "-u", "demo", "--password=demo" ]
      interval: 5s
      timeout: 5s
      retries: 30
