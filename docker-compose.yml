#       - jobmanager
#       - kafka
#     volumes:
#       - ./docker/zeppelin/notebook:/opt/zeppelin/notebook
  ruleengine:
    image: rule-engine:17.0
    command:
      - /opt/flink/bin/flink
      - run
      - --jobmanager
      - jobmanager:8081
      - -D
      - classloader.resolve-order=parent-first
      - -c
      - org.apache.flinkmeetup.applauncher.Launcher
      - /opt/flink/usrlib/rule-engine-all.jar
    build:
      context: docker/rule-engine
      args:
        FLINK_IMAGE: flink-image:2.0.0-scala_2.12
    links:
      - jobmanager
      - kafka
      - mysql
    depends_on:
        mysql:
          condition: service_healthy
        jobmanager:
          condition: service_started
        kafka:
          condition: service_started
    environment:
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        classloader.resolve-order: parent-first
